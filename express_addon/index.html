<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chameleon Express</title><style>body{font:14px system-ui;background:#17221f;color:#e9fff5;padding:18px}select,input,button{font:inherit;padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#a0f4c5;border:0;border-radius:6px}button:disabled{opacity:.45}#compatibility{white-space:pre-line;font-size:12px}img{width:100%;max-height:420px;object-fit:contain}p{line-height:1.5}</style></head><body><h1>Chameleon</h1><p>Adapt a structured design, compare options, and add a supported result as editable content.</p><label>Engine URL<input id="base" value="http://127.0.0.1:8765"></label><label>Source task JSON<input id="file" type="file" accept="application/json,.json"></label><label>Width<input id="width" type="number" value="1080" min="1"></label><label>Height<input id="height" type="number" value="1350" min="1"></label><button id="generate">Generate options</button><select id="candidate" aria-label="Layout option"></select><img id="preview" alt="Generated layout preview"><p id="compatibility" aria-live="polite"></p><button id="apply" disabled>Add editable result in Express</button><p id="status" role="status">Upload a task to begin. Image assets must be available to the engine.</p><script type="module" src="/src/panel.js"></script></body></html>
