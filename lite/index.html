<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chameleon Resize</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--ink:#1b1b1a;--muted:#6b6a66;--line:#e3e2de;--accent:#2f6b4f;--accent-ink:#fff;--chip:#f0efeb;--bad:#a8402f}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--panel:#1e1e1c;--ink:#ecebe7;--muted:#9d9b95;--line:#33322f;--accent:#5fae86;--accent-ink:#0f1a14;--chip:#2a2927;--bad:#e0806f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:650}
header span{color:var(--muted)}
main{display:grid;grid-template-columns:360px 1fr;gap:0;min-height:calc(100vh - 60px)}
aside{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;border-right:1px solid var(--line);padding:20px;background:var(--panel);display:flex;flex-direction:column;gap:22px}
section h2{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid var(--line);background:none;color:var(--ink);padding:6px;border-radius:7px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--chip);font-weight:600}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:230px;overflow:auto}
.pick button{border:2px solid transparent;background:var(--chip);border-radius:7px;padding:0;cursor:pointer;aspect-ratio:1;overflow:hidden;color:var(--muted);font-size:11px}
.pick button.on{border-color:var(--accent)}
.pick img{width:100%;height:100%;object-fit:contain;display:block}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.src{margin-top:10px;background:var(--chip);border-radius:9px;min-height:120px;display:grid;place-items:center;overflow:hidden}
.src img{max-width:100%;max-height:220px;display:block}
.meta{color:var(--muted);font-size:12px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips small{opacity:.7;margin-left:4px}
.custom{display:flex;gap:6px;margin-top:10px}
.custom input{width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit}
.custom button,.go{border:0;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
.custom button{background:var(--chip);color:var(--ink);padding:6px 12px}
.go{background:var(--accent);color:var(--accent-ink);padding:11px;font-size:15px;width:100%}
.go:disabled{opacity:.45;cursor:not-allowed}
.results{padding:22px;overflow:auto}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.bar h2{margin:0;font-size:16px}
.bar a{color:var(--accent);font-weight:600;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.frame{background:repeating-conic-gradient(var(--chip) 0 25%,transparent 0 50%) 0 0/16px 16px;display:grid;place-items:center;min-height:160px;padding:10px;position:relative}
.frame img{max-width:100%;max-height:340px;display:block;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 7px;border-radius:5px}
.info{padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.info b{flex:1;font-weight:600}
.info .t{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;padding:0 12px 12px}
.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);border-radius:7px;padding:6px;font:inherit;font-size:12.5px;color:var(--ink);background:none;text-decoration:none;cursor:pointer;user-select:none}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:13px;padding:14px}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
@media (max-width:820px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><h1>Chameleon Resize</h1><span>One design in, every size out.</span></header>
<main>
<aside>
  <section>
    <h2>1 · Design</h2>
    <div class="tabs"><button data-tab="gallery" class="on">Gallery</button><button data-tab="samples">Samples</button><button data-tab="upload">Upload</button></div>
    <div id="pane"></div>
    <div class="src" id="src"><span class="meta">Pick a design</span></div>
    <div class="meta" id="srcmeta"></div>
  </section>
  <section>
    <h2>2 · Sizes</h2>
    <div class="chips" id="chips"></div>
    <div class="custom"><input id="cw" type="number" placeholder="Width" min="16" max="4096"><input id="ch" type="number" placeholder="Height" min="16" max="4096"><button id="add">Add size</button></div>
  </section>
  <button class="go" id="go" disabled>Resize</button>
</aside>
<div class="results">
  <div class="bar"><h2 id="rtitle"></h2><a id="zip" hidden>Download all (ZIP)</a></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Pick a design and some sizes, then press Resize.</p>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const api=async(u,o)=>{const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:(j.detail?.message||r.statusText));return j};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let source=null,tab='gallery',gallery=null,samples=null,picked=null;
const sizes=new Map();  // key "WxH" -> {width,height,label}

async function showPane(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const pane=$('#pane');
  if(tab==='upload'){
    pane.innerHTML='<label class="drop">Drop or choose a Chameleon design .json<input type="file" accept=".json,application/json" hidden></label>';
    const input=pane.querySelector('input');
    input.onchange=()=>input.files[0]&&readFile(input.files[0]);
    pane.firstChild.ondragover=e=>e.preventDefault();
    pane.firstChild.ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&readFile(e.dataTransfer.files[0])};
    return;
  }
  pane.innerHTML='<div class="pick"><span class="meta">Loading…</span></div>';
  const grid=pane.firstChild;
  try{
    if(tab==='gallery'){
      gallery=gallery||(await api('/api/crello?status=ready&limit=100')).items;
      grid.innerHTML='';
      gallery.forEach(it=>{const b=document.createElement('button');b.title=it.title;b.innerHTML=`<img loading="lazy" src="${it.reference}" alt="">`;
        b.classList.toggle('on',picked===it.id);b.onclick=()=>pickGallery(it,b);grid.append(b)});
    }else{
      samples=samples||await api('/api/samples');
      grid.innerHTML='';
      samples.forEach(it=>{const b=document.createElement('button');b.textContent=it.title;b.classList.toggle('on',picked===it.id);
        b.onclick=()=>{mark(b,it.id);setSource(it.source,it.title)};grid.append(b)});
    }
  }catch(e){grid.innerHTML=`<span class="err">${e.message}</span>`}
}
function mark(b,id){picked=id;document.querySelectorAll('.pick button').forEach(x=>x.classList.remove('on'));b&&b.classList.add('on')}
async function pickGallery(it,b){mark(b,it.id);try{const d=await api('/api/crello/'+it.id);setSource(d.source,it.title)}catch(e){srcError(e)}}
function readFile(f){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);mark(null,null);setSource(j.source||j,f.name)}catch(e){srcError(new Error('That file is not valid JSON.'))}};r.readAsText(f)}
function srcError(e){$('#src').innerHTML=`<span class="err">${e.message}</span>`;source=null;sync()}
async function setSource(d,title){
  source=null;sync();
  $('#src').innerHTML='<div class="spin"></div>';
  $('#srcmeta').textContent=`${title} · ${d.canvas?.width}×${d.canvas?.height} · ${d.elements?.length} layers`;
  try{const r=await post('/api/preview',{design:d});$('#src').innerHTML=`<img src="${r.render}" alt="Source design">`;source=d}
  catch(e){srcError(e)}
  sync();
}

function chip(s,preset){
  const key=s.width+'x'+s.height,b=document.createElement('button');
  b.innerHTML=`${s.label}<small>${s.width}×${s.height}</small>`;
  b.onclick=()=>{if(sizes.has(key)){sizes.delete(key);b.classList.remove('on');if(!preset)b.remove()}else{sizes.set(key,s);b.classList.add('on')}sync()};
  $('#chips').append(b);return b;
}
async function loadPresets(){
  const ps=await api('/api/presets');
  ps.forEach((p,i)=>{const b=chip(p,true);if(i===0||i===5){sizes.set(p.width+'x'+p.height,p);b.classList.add('on')}});sync();
}
$('#add').onclick=()=>{
  const w=+$('#cw').value,h=+$('#ch').value;
  if(!(w>=16&&h>=16&&w<=4096&&h<=4096))return alert('Width and height must be between 16 and 4096.');
  const key=w+'x'+h;if(sizes.has(key))return;
  const s={width:w,height:h,label:'Custom'};sizes.set(key,s);chip(s,false).classList.add('on');sync();
};
function sync(){$('#go').disabled=!source||!sizes.size||running;$('#go').textContent=running?'Resizing…':`Resize to ${sizes.size} size${sizes.size===1?'':'s'}`}

let running=false;
$('#go').onclick=async()=>{
  running=true;sync();$('#empty').hidden=true;$('#zip').hidden=true;
  const list=[...sizes.values()];
  $('#rtitle').textContent=`Resizing to ${list.length} size${list.length===1?'':'s'}…`;
  $('#grid').innerHTML='';
  try{
    const {id}=await post('/api/resize',{source,sizes:list.map(({width,height,label})=>({width,height,label}))});
    let job;
    do{await new Promise(r=>setTimeout(r,1200));job=await api('/api/jobs/'+id);draw(job)}while(job.state!=='done');
    const ok=job.items.filter(i=>i.state==='done').length;
    $('#rtitle').textContent=`${ok} of ${job.items.length} sizes ready`;
    if(ok){$('#zip').href=`/api/jobs/${id}/zip`;$('#zip').hidden=false}
  }catch(e){$('#rtitle').textContent='';$('#grid').innerHTML=`<p class="err">${e.message}</p>`}
  running=false;sync();
};
function draw(job){
  const grid=$('#grid');
  job.items.forEach((it,i)=>{
    let card=grid.children[i];
    const sig=it.state;
    if(card&&card.dataset.sig===sig)return;
    const c=document.createElement('div');c.className='card';c.dataset.sig=sig;
    const note={original:'Same size: original kept',scaled:'Same shape: scaled, layout kept'}[it.method];
    const head=`<div class="info"><b>${it.label}</b><span class="t">${it.width}×${it.height}${it.seconds?` · ${it.seconds}s`:''}</span>${note?`<span class="t" style="flex-basis:100%">${note}</span>`:''}</div>`;
    if(it.state==='done'){
      c.innerHTML=`<div class="frame"><img src="${it.render}" alt="${it.label}"><span class="tag" hidden>Plain stretch</span></div>${head}
        <div class="acts">${it.stretch?'<button class="cmp" title="Hold to see a plain stretch of the original">Compare</button>':''}
        <a href="${it.render}" download="${it.width}x${it.height}.png">PNG</a><a href="${it.design}" download="${it.width}x${it.height}.json">JSON</a></div>`;
      const img=c.querySelector('img'),tag=c.querySelector('.tag'),btn=c.querySelector('.cmp');
      if(btn){const on=()=>{img.src=it.stretch;tag.hidden=false},off=()=>{img.src=it.render;tag.hidden=true};
        btn.onpointerdown=on;btn.onpointerup=off;btn.onpointerleave=off;
        btn.onkeydown=e=>{if(e.key===' '||e.key==='Enter')on()};btn.onkeyup=off}
    }else if(it.state==='failed'){
      c.innerHTML=`<div class="err">${it.error}</div>${head}`;
    }else{
      c.innerHTML=`<div class="frame"><div class="spin" ${it.state==='queued'?'style="animation-play-state:paused;opacity:.4"':''}></div></div>${head}`;
    }
    card?grid.replaceChild(c,card):grid.append(c);
  });
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;showPane()});
showPane();loadPresets();
</script>
</body>
</html>
